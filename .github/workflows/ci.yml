name: CI

on:
  push:
    # dev is where all work lands (see AGENTS.md); main only ever fast-forwards
    # to it. Without dev here nothing runs until the merge — which is how a red
    # lint and a broken browser test once sat on dev unnoticed.
    branches: [main, dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Lets the contact form succeed against a production build with no live
      # mail provider. See lib/mail.ts.
      MAIL_TRANSPORT: console

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: install
        run: npm ci

      # Every check below runs even when an earlier one failed. GitHub's default
      # is to abandon the job at the first failure, which meant a lint error —
      # the cheapest check, and the first to run — silently skipped the unit
      # tests, the build and the whole browser suite. Three days of red main
      # runs reported nothing except "lint failed"; nobody knew whether the site
      # still built. A failing step still fails the job, so this hides nothing;
      # it just stops one failure from suppressing every other answer.
      #
      # Gated on the install rather than `always()`: with no node_modules the
      # remaining steps cannot say anything useful, and `always()` would also
      # run them after a cancellation.
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsc --noEmit

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx eslint .

      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      # Chromium only — the full browser set triples the download for no gain
      # on a suite this size.
      - name: Install Playwright Chromium
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
